[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "production-python-core"
version = "0.1.0"
description = "A minimal hands-on reference for core production Python concepts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.setuptools]
py-modules = []
