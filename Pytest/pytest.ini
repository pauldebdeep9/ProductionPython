[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -ra
markers =
    budget(usd): per-test cost budget, read by the budget_from_marker fixture.
    unit: fast, no I/O, no sleeps. Runs on every save.
    integration: crosses a real boundary (filesystem, container, network).
    contract: verifies a fake matches the real implementation's behaviour.
    eval: an LLM quality evaluation. Slow, costs money, reported as k/n.
    slow: takes more than ~1s. Excluded from the default run.
    security: asserts a security invariant. NEVER skipped, NEVER xfailed.
